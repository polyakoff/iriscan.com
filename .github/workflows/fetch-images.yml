name: Fetch blog images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/img/blog/sources.json

permissions:
  contents: write
  pages: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download images
        run: python3 tools/fetch_images.py
      - name: Commit
        run: |
          git config user.name "Artem Poliakov"
          git config user.email "artem@iriscan.net"
          git add assets/img/blog
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Blog photos from Unsplash"
          git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"
        id: commit
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; the next push rebuilds the site"
