<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Poppins,Arial,sans-serif">
<rect width="1200" height="675" fill="#17181a"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b6b8c1"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7bc47f"/></marker></defs>
<text x="600" y="80" fill="#fff" font-size="30" font-weight="500" text-anchor="middle">A policy lives for years. Identity is checked at every turn.</text>
<line x1="110" y1="330" x2="1090" y2="330" stroke="#3a3c42" stroke-width="4"/>
<circle cx="160" cy="330" r="34" fill="#1f2022" stroke="#889ce7" stroke-width="3"/><ellipse cx="160" cy="330" rx="22.099999999999998" ry="13" fill="none" stroke="#889ce7" stroke-width="2.5"/><circle cx="160" cy="330" r="8.06" fill="none" stroke="#889ce7" stroke-width="2.5"/><circle cx="160" cy="330" r="3.25" fill="#889ce7"/>
<text x="160" y="205" fill="#889ce7" font-size="17" font-weight="600" text-anchor="middle">Year 0</text>
<text x="160" y="238" fill="#fff" font-size="24" font-weight="500" text-anchor="middle">Sale</text>
<text x="160" y="266" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">policyholder and</text>
<text x="160" y="290" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">beneficiaries enrolled</text>
<circle cx="440" cy="330" r="34" fill="#1f2022" stroke="#e9c46a" stroke-width="3"/><ellipse cx="440" cy="330" rx="22.099999999999998" ry="13" fill="none" stroke="#e9c46a" stroke-width="2.5"/><circle cx="440" cy="330" r="8.06" fill="none" stroke="#e9c46a" stroke-width="2.5"/><circle cx="440" cy="330" r="3.25" fill="#e9c46a"/>
<text x="440" y="400" fill="#e9c46a" font-size="17" font-weight="600" text-anchor="middle">Year 4</text>
<text x="440" y="433" fill="#fff" font-size="24" font-weight="500" text-anchor="middle">Beneficiary changed</text>
<text x="440" y="461" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">policyholder confirms</text>
<text x="440" y="485" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">with the same scan</text>
<circle cx="760" cy="330" r="34" fill="#1f2022" stroke="#fd6262" stroke-width="3"/><ellipse cx="760" cy="330" rx="22.099999999999998" ry="13" fill="none" stroke="#fd6262" stroke-width="2.5"/><circle cx="760" cy="330" r="8.06" fill="none" stroke="#fd6262" stroke-width="2.5"/><circle cx="760" cy="330" r="3.25" fill="#fd6262"/>
<text x="760" y="205" fill="#fd6262" font-size="17" font-weight="600" text-anchor="middle">Year 9</text>
<text x="760" y="238" fill="#fff" font-size="24" font-weight="500" text-anchor="middle">Bank account changed</text>
<text x="760" y="266" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">takeover attempt fails:</text>
<text x="760" y="290" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">scan does not match</text>
<circle cx="1040" cy="330" r="34" fill="#1f2022" stroke="#7bc47f" stroke-width="3"/><ellipse cx="1040" cy="330" rx="22.099999999999998" ry="13" fill="none" stroke="#7bc47f" stroke-width="2.5"/><circle cx="1040" cy="330" r="8.06" fill="none" stroke="#7bc47f" stroke-width="2.5"/><circle cx="1040" cy="330" r="3.25" fill="#7bc47f"/>
<text x="1040" y="400" fill="#7bc47f" font-size="17" font-weight="600" text-anchor="middle">Year 15</text>
<text x="1040" y="433" fill="#fff" font-size="24" font-weight="500" text-anchor="middle">Claim and payout</text>
<text x="1040" y="461" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">beneficiary verified</text>
<text x="1040" y="485" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">before money moves</text>
<text x="600" y="575" fill="#b6b8c1" font-size="19" font-weight="400" text-anchor="middle">Without a template on file, each of these moments is only a document check.</text>
</svg>
