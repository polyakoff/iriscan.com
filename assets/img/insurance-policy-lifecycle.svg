<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Poppins,Arial,sans-serif">
<rect width="1200" height="675" fill="#17181a"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b6b8c1"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7bc47f"/></marker></defs>
<text x="600" y="80" fill="#fff" font-size="30" font-weight="500" text-anchor="middle">The policy covers a person, not a card</text>
<rect x="70" y="250" width="300" height="170" rx="16" fill="#1f2022" stroke="#889ce7" stroke-width="2.5"/>
<rect x="100" y="280" width="90" height="58" rx="8" fill="none" stroke="#889ce7" stroke-width="2"/><line x1="112" y1="300" x2="176" y2="300" stroke="#889ce7" stroke-width="2"/><line x1="112" y1="318" x2="156" y2="318" stroke="#889ce7" stroke-width="2"/>
<text x="205" y="302" fill="#fff" font-size="20" font-weight="500" text-anchor="start">Policy 20417</text><text x="205" y="328" fill="#b6b8c1" font-size="16" font-weight="400" text-anchor="start">card shown</text>
<text x="220" y="375" fill="#b6b8c1" font-size="17" font-weight="400" text-anchor="middle">at the counter or with a claim,</text><text x="220" y="400" fill="#b6b8c1" font-size="17" font-weight="400" text-anchor="middle">by whoever holds it</text>
<line x1="374" y1="335" x2="508" y2="335" stroke="#b6b8c1" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="590" cy="335" r="78" fill="#1f2022" stroke="#3a3c42" stroke-width="2"/><ellipse cx="590" cy="335" rx="51.0" ry="30" fill="none" stroke="#889ce7" stroke-width="2.5"/><circle cx="590" cy="335" r="18.6" fill="none" stroke="#889ce7" stroke-width="2.5"/><circle cx="590" cy="335" r="7.5" fill="#889ce7"/><text x="590" y="445" fill="#fff" font-size="20" font-weight="500" text-anchor="middle">Iris scan</text><text x="590" y="472" fill="#b6b8c1" font-size="16" font-weight="400" text-anchor="middle">compared with the template</text><text x="590" y="494" fill="#b6b8c1" font-size="16" font-weight="400" text-anchor="middle">enrolled at sale</text>
<path d="M670 305 C 720 250, 740 215, 790 215" fill="none" stroke="#7bc47f" stroke-width="2.5" marker-end="url(#g)"/>
<path d="M670 365 C 720 420, 740 455, 790 455" fill="none" stroke="#fd6262" stroke-width="2.5" stroke-dasharray="7 6"/><polygon points="790,447 806,455 790,463" fill="#fd6262"/>
<rect x="808" y="150" width="330" height="130" rx="16" fill="#1f2022" stroke="#7bc47f" stroke-width="2.5"/><text x="973" y="195" fill="#fff" font-size="22" font-weight="500" text-anchor="middle">The insured person</text><text x="973" y="228" fill="#7bc47f" font-size="17" font-weight="400" text-anchor="middle">match: the service is covered,</text><text x="973" y="252" fill="#7bc47f" font-size="17" font-weight="400" text-anchor="middle">the claim goes ahead</text>
<rect x="808" y="390" width="330" height="130" rx="16" fill="#1f2022" stroke="#fd6262" stroke-width="2.5"/><text x="973" y="435" fill="#fff" font-size="22" font-weight="500" text-anchor="middle">His brother, same policy</text><text x="973" y="468" fill="#fd6262" font-size="17" font-weight="400" text-anchor="middle">no match: not covered,</text><text x="973" y="492" fill="#fd6262" font-size="17" font-weight="400" text-anchor="middle">the attempt is logged</text>
<text x="600" y="600" fill="#b6b8c1" font-size="19" font-weight="400" text-anchor="middle">The card can be lent within a family. The iris cannot.</text>
</svg>
