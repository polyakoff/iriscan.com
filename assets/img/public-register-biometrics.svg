<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Poppins,Arial,sans-serif">
<rect width="1200" height="675" fill="#17181a"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b6b8c1"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7bc47f"/></marker></defs>
<text x="600" y="80" fill="#fff" font-size="30" font-weight="500" text-anchor="middle">One register, checked where decisions are made</text>
<circle cx="600" cy="350" r="120" fill="#1f2022" stroke="#889ce7" stroke-width="3"/><text x="600" y="335" fill="#fff" font-size="26" font-weight="500" text-anchor="middle">National</text><text x="600" y="368" fill="#fff" font-size="26" font-weight="500" text-anchor="middle">register</text><text x="600" y="400" fill="#b6b8c1" font-size="15" font-weight="400" text-anchor="middle">one record per person</text>
<rect x="50" y="140" width="280" height="120" rx="16" fill="#1f2022" stroke="#889ce7" stroke-width="2.5"/>
<text x="190" y="185" fill="#fff" font-size="23" font-weight="500" text-anchor="middle">Enrollment</text><text x="190" y="215" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">de-duplicated against</text><text x="190" y="239" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">the whole register</text>
<line x1="330" y1="200" x2="495" y2="290" stroke="#b6b8c1" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="50" y="440" width="280" height="120" rx="16" fill="#1f2022" stroke="#e9c46a" stroke-width="2.5"/>
<text x="190" y="485" fill="#fff" font-size="23" font-weight="500" text-anchor="middle">Fallback</text><text x="190" y="515" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">logged and reviewed</text><text x="190" y="539" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">when a scan fails</text>
<line x1="330" y1="500" x2="495" y2="410" stroke="#b6b8c1" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="870" y="140" width="280" height="120" rx="16" fill="#1f2022" stroke="#fd6262" stroke-width="2.5"/>
<text x="1010" y="185" fill="#fff" font-size="23" font-weight="500" text-anchor="middle">Polling station</text><text x="1010" y="215" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">voter matched</text><text x="1010" y="239" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">to the record</text>
<line x1="705" y1="290" x2="870" y2="200" stroke="#b6b8c1" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="870" y="440" width="280" height="120" rx="16" fill="#1f2022" stroke="#7bc47f" stroke-width="2.5"/>
<text x="1010" y="485" fill="#fff" font-size="23" font-weight="500" text-anchor="middle">Border post</text><text x="1010" y="515" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">arrival checked against</text><text x="1010" y="539" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">records and watch lists</text>
<line x1="705" y1="410" x2="870" y2="500" stroke="#b6b8c1" stroke-width="2.5" marker-end="url(#a)"/>
<text x="600" y="625" fill="#b6b8c1" font-size="18" font-weight="400" text-anchor="middle">Every match and every manual decision goes to an audit log open to observers.</text>
</svg>
